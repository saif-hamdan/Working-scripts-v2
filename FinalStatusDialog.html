<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <base target="_top">
  <style>
    body { font-family: Arial, sans-serif; margin: 18px; color: #1f2933; }
    .card { border: 1px solid #d9e2ec; border-radius: 10px; padding: 14px; background: #f8fafc; }
    .row { margin: 8px 0; }
    .label { font-weight: 700; }
    .actions { display: flex; gap: 8px; margin-top: 14px; }
    button { border: 0; border-radius: 6px; color: #fff; cursor: pointer; padding: 10px 14px; }
    button:disabled { cursor: not-allowed; opacity: .6; }
    .approve { background: #15803d; }
    .reject { background: #b91c1c; }
    .reload { background: #2563eb; }
    .spinner { display: none; margin: 14px auto; border: 4px solid #e5e7eb; border-top: 4px solid #2563eb; border-radius: 50%; width: 34px; height: 34px; animation: spin 1s linear infinite; }
    .message { margin-top: 14px; padding: 10px; border-radius: 6px; display: none; }
    .success { background: #dcfce7; color: #166534; display: block; }
    .failure { background: #fee2e2; color: #991b1b; display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h2>تغيير حالة الاعتماد النهائي</h2>
  <div id="content" class="card">جارٍ قراءة الصف المحدد...</div>
  <div id="spinner" class="spinner" aria-label="loading"></div>
  <div id="message" class="message"></div>

  <script>
    var context = null;

    function setMessage(text, ok) {
      var el = document.getElementById('message');
      el.textContent = text;
      el.className = 'message ' + (ok ? 'success' : 'failure');
    }

    function setLoading(isLoading) {
      document.getElementById('spinner').style.display = isLoading ? 'block' : 'none';
      Array.prototype.forEach.call(document.querySelectorAll('button'), function(button) {
        button.disabled = isLoading;
      });
    }

    function renderContext(result) {
      if (!result || !result.success) {
        document.getElementById('content').innerHTML =
          '<p>' + ((result && result.message) || 'تعذر قراءة الصف المحدد.') + '</p>' +
          '<button class="reload" onclick="loadContext()">إعادة المحاولة</button>';
        return;
      }
      context = result;
      document.getElementById('content').innerHTML =
        '<div class="row"><span class="label">رقم الصف:</span> ' + result.rowNumber + '</div>' +
        '<div class="row"><span class="label">رقم الطلب:</span> ' + escapeHtml(result.requestId) + '</div>' +
        '<div class="row"><span class="label">الموظف:</span> ' + escapeHtml(result.employeeName || '-') + '</div>' +
        '<div class="row"><span class="label">حالة رئيس الوحدة:</span> ' + escapeHtml(result.headStatus || '-') + '</div>' +
        '<div class="row"><span class="label">الحالة النهائية الحالية:</span> ' + escapeHtml(result.finalStatus || '-') + '</div>' +
        '<p>اختر الإجراء المطلوب. Are you sure you want to do this action and send the email?</p>' +
        '<div class="actions">' +
          '<button class="approve" onclick="confirmAction(\'' + result.actions[0] + '\')">' + result.actions[0] + '</button>' +
          '<button class="reject" onclick="confirmAction(\'' + result.actions[1] + '\')">' + result.actions[1] + '</button>' +
        '</div>';
    }

    function confirmAction(targetStatus) {
      if (!context) return;
      if (!confirm('الإجراء: ' + targetStatus + '\nAre you sure you want to do this action and send the email?')) return;
      setMessage('جارٍ تنفيذ الإجراء: ' + targetStatus + '...', true);
      setLoading(true);
      google.script.run
        .withSuccessHandler(function(result) {
          setLoading(false);
          setMessage((result && result.message) || 'اكتمل التنفيذ.', !!(result && result.success));
          loadContext();
        })
        .withFailureHandler(function(error) {
          setLoading(false);
          setMessage('فشل التنفيذ: ' + (error && error.message ? error.message : error), false);
        })
        .confirmFinalStatusChange(context.rowNumber, targetStatus);
    }

    function loadContext() {
      setLoading(true);
      google.script.run
        .withSuccessHandler(function(result) { setLoading(false); renderContext(result); })
        .withFailureHandler(function(error) {
          setLoading(false);
          renderContext({ success: false, message: error && error.message ? error.message : String(error) });
        })
        .getSelectedFinalStatusContext();
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, function(ch) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[ch];
      });
    }

    loadContext();
  </script>
</body>
</html>
